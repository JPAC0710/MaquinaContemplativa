<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PISTA // LA MÁQUINA CONTEMPLATIVA</title>
<style>
:root{--bg:0,0,0;--pn:12,12,14;--fg:236,236,236;--dim:150,150,150;--ac:255,60,60;--cy:0,255,255;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:238,235,226;--pn:250,248,242;--fg:20,20,20;--dim:96,94,88;--ac:196,22,28;--cy:0,120,140;color-scheme:light}}
:root[data-theme="light"]{--bg:238,235,226;--pn:250,248,242;--fg:20,20,20;--dim:96,94,88;--ac:196,22,28;--cy:0,120,140;color-scheme:light}
:root[data-theme="dark"]{--bg:0,0,0;--pn:12,12,14;--fg:236,236,236;--dim:150,150,150;--ac:255,60,60;--cy:0,255,255;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:rgb(var(--bg));color:rgb(var(--fg));font:16px/1.55 ui-monospace,Menlo,Consolas,"Courier New",monospace}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgb(var(--bg));z-index:10}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.8}
.scan{position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(var(--fg),.05) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35) 100%)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;justify-content:space-between;gap:8px;padding:10px 16px;font-size:12px;letter-spacing:.06em;background:rgba(var(--bg),.92);border-bottom:1px solid rgba(var(--ac),.6)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:rgb(var(--ac));margin-right:6px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:18px 16px 70px}
h1,h2{margin:0;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
h1{font-size:clamp(28px,9vw,44px)}
.gl{text-shadow:2px 0 rgba(var(--ac),.85),-2px 0 rgba(var(--cy),.7)}
.gl.on{animation:jit .35s steps(3)}
@keyframes jit{0%{transform:translate(0)}25%{transform:translate(-4px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,0)}100%{transform:translate(0)}}
.ac{color:rgb(var(--ac))}.dim{color:rgb(var(--dim))}
.card{position:relative;margin:16px 0;padding:18px;background:rgba(var(--pn),.9);border:1px solid rgba(var(--fg),.25)}
.card::before,.card::after{content:"";position:absolute;width:16px;height:16px;border:2px solid rgb(var(--ac))}
.card::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.card::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.btn{display:block;width:100%;min-height:48px;margin:10px 0 0;padding:14px 16px;font:inherit;text-align:left;color:rgb(var(--fg));background:rgba(var(--pn),.95);border:1.5px solid rgba(var(--fg),.4);border-radius:4px;cursor:pointer}
.btn:hover,.btn:focus-visible{border-color:rgb(var(--ac));outline:0;box-shadow:0 0 0 3px rgba(var(--ac),.3)}
.btn.go{border-color:rgb(var(--ac));background:rgba(var(--ac),.16)}
.route{list-style:none;margin:12px 0 0;padding:0;font-size:14px}
.route li{padding:3px 0}.route .cur{color:rgb(var(--ac))}.route .off{color:rgb(var(--dim))}
.riddle{white-space:pre-wrap;font-size:18px;min-height:6.5em;cursor:pointer}
.help{margin-top:12px;padding:12px;border-left:3px solid rgb(var(--ac));background:rgba(var(--ac),.1)}
.q{margin-top:14px;font-size:13px;color:rgb(var(--dim))}
.eye{display:block;width:min(260px,70%);margin:6px auto 14px}
.num{font-size:clamp(90px,34vw,170px);line-height:1;text-align:center;margin:8px 0}
.stamp{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(var(--bg),.93);text-align:center;padding:20px}
.tick{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));overflow:hidden;white-space:nowrap;font-size:12px;color:rgb(var(--ac));background:rgba(var(--bg),.92);border-top:1px solid rgba(var(--ac),.6)}
.tick span{display:inline-block;padding-left:100%;animation:mq 38s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.mini{margin-top:26px;background:none;border:0;padding:8px 0;font:inherit;font-size:12px;color:rgb(var(--dim));text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){.dot,.gl.on,.tick span{animation:none}#rain{display:none}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>
<header><span>LA MÁQUINA CONTEMPLATIVA V.2</span><span><i class="dot"></i>REC <b id="clk">--:--:--</b></span></header>
<main id="app"></main>
<div class="tick" aria-hidden="true"><span>NO SE MUEVA // USTED ESTÁ SIENDO OBSERVADO // CADA PASO CUENTA // ¿QUIÉN MIRA? // EL TIEMPO ES DATO // CONTEMPLAR ES UN ACTO SOSPECHOSO // TODO SE CLASIFICA //</span></div>
<script>
(function(){
'use strict';
var S=[
 {k:'PORTERÍA',r:'Todo sistema de vigilancia empieza en una puerta.\nAlguien te ve entrar antes de que tú mires a nadie.\nCruza el umbral: desde aquí, todo cuenta.',h:'Entra por la portería. Cuando ya estés adentro, toca “YA LLEGUÉ”.',q:'MIENTRAS ENTRAS: ¿cuántas cosas te miran y cuántas ves tú?'},
 {k:'TABLERO DE INFORMACIÓN',r:'Un muro donde todos publican y nadie firma.\nAvisos para todos, lectores sin rostro.\nLee lo que dice… y también lo que calla.',h:'Ve al tablero de información. Cuando estés frente a él, toca “YA LLEGUÉ”.',q:'MIENTRAS LEES: ¿por qué te detuviste en ese aviso y no en otro?'},
 {k:'TERCER PISO',r:'Un piso no es un lugar: es un número.\nSube hasta el tercero.\nCuenta los escalones si quieres: la máquina también cuenta.',h:'Sube al tercer piso (por escaleras o ascensor, como te sea posible). Cuando llegues, toca “YA LLEGUÉ”. Si necesitas ayuda para llegar, pídela en la portería.',q:'MIENTRAS SUBES: ¿te mueves porque quieres o porque te lo pidieron?'},
 {k:'SALÓN 311',r:'Tres, uno, uno.\nUn número que parece una dirección y es una orden.\nAhí dentro te espera un tesoro que no se guarda: te mira.',h:'Busca el salón 311, en el tercer piso. Cuando estés en la puerta, toca “YA LLEGUÉ”.',q:'ANTES DE ENTRAR: ¿puedes quedarte quieto sin hacer nada?'}
];
var K='mc311',app=document.getElementById('app'),timer=0,st=load();
function load(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
function two(n){return (n<10?'0':'')+n}
function hms(t){var d=new Date(t);return two(d.getHours())+':'+two(d.getMinutes())+':'+two(d.getSeconds())}
function mmss(ms){var s=Math.round(ms/1000);return two(Math.floor(s/60))+':'+two(s%60)}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

setInterval(function(){document.getElementById('clk').textContent=hms(Date.now())},1000);
document.getElementById('clk').textContent=hms(Date.now());

function glitch(el){if(reduce)return;el.classList.remove('on');void el.offsetWidth;el.classList.add('on')}

function typeInto(el,text){
  clearTimeout(timer);
  if(reduce){el.textContent=text;return}
  var i=0;
  function tick(){i+=2;el.textContent=text.slice(0,i)+(i<text.length?'_':'');if(i<text.length)timer=setTimeout(tick,24)}
  el.onclick=function(){clearTimeout(timer);el.textContent=text};
  tick();
}

function route(){
  var h='<ol class="route" aria-label="Ruta de la búsqueda">';
  S.forEach(function(s,k){
    var done=k<st.i,cur=k===st.i;
    h+='<li class="'+(cur?'cur':(done?'':'off'))+'">'+(done?'[X] ':(cur?'[>] ':'[ ] '))+'PISTA 0'+(k+1)+' — '+(done?s.k+' ('+hms(st.ts[k])+')':'??????')+'</li>';
  });
  return h+'</ol>';
}

function landing(){
  app.innerHTML='<svg class="eye" viewBox="0 0 200 100" aria-hidden="true"><path d="M10 50Q100 -12 190 50Q100 112 10 50Z" style="fill:none;stroke:rgb(var(--ac));stroke-width:3"/><g id="iris"><circle cx="100" cy="50" r="22" style="fill:rgb(var(--ac))"/><circle cx="100" cy="50" r="9" style="fill:rgb(var(--bg))"/><circle cx="93" cy="43" r="4" style="fill:rgb(var(--fg))"/></g></svg>'
  +'<h1 class="gl" id="ttl">La máquina contemplativa</h1>'
  +'<p class="ac">BÚSQUEDA DEL TESORO // 4 PISTAS // 1 DESTINO</p>'
  +'<div class="card"><p>Alguien te está mirando.</p><p>Esta es una búsqueda: cada pista te lleva a un lugar y cada lugar te lleva al siguiente. Tu avance se guarda solo en tu teléfono.</p>'
  +'<button class="btn go" id="start">[ ENTRAR ES ACEPTAR ]</button></div>';
  glitch(document.getElementById('ttl'));
  document.getElementById('start').onclick=function(){st={on:1,i:0,t0:Date.now(),ts:[]};save();render()};
  var iris=document.getElementById('iris');
  function look(x,y){var dx=(x/innerWidth-.5)*2,dy=(y/innerHeight-.5)*2;iris.setAttribute('transform','translate('+(dx*26).toFixed(1)+' '+(dy*8).toFixed(1)+')')}
  addEventListener('pointermove',function(e){look(e.clientX,e.clientY)});
  addEventListener('touchmove',function(e){var t=e.touches[0];if(t)look(t.clientX,t.clientY)},{passive:true});
}

function clue(){
  var s=S[st.i],n=st.i+1;
  app.innerHTML='<h2 class="gl" id="ttl">Pista 0'+n+' <span class="dim">/ 04</span></h2>'+route()
  +'<div class="card"><div class="riddle" id="rd" aria-hidden="true"></div><p class="sr" id="rdsr" style="position:absolute;left:-9999px" aria-live="polite"></p>'
  +'<div id="hp"></div><p class="q">'+s.q+'</p>'
  +'<button class="btn" id="help">[ AYUDA: DIME DÓNDE ES ]</button>'
  +'<button class="btn go" id="ok">[ YA LLEGUÉ ]</button></div>';
  glitch(document.getElementById('ttl'));
  document.getElementById('rdsr').textContent=s.r;
  typeInto(document.getElementById('rd'),s.r);
  document.getElementById('help').onclick=function(){document.getElementById('hp').innerHTML='<p class="help">'+s.h+'</p>';this.style.display='none'};
  document.getElementById('ok').onclick=function(){
    st.ts[st.i]=Date.now();st.i++;save();
    var o=document.createElement('div');o.className='stamp';o.setAttribute('role','status');
    o.innerHTML='<h2 class="gl on">Registrado</h2><p class="ac">PISTA 0'+n+' // '+s.k+'</p><p class="dim">'+hms(st.ts[n-1])+'</p>';
    document.body.appendChild(o);
    setTimeout(function(){o.remove();render()},reduce?500:1100);
  };
}

function final(){
  var total=st.ts[S.length-1]-st.t0;
  app.innerHTML='<h2 class="ac">HALLAZGO</h2><div class="num gl" id="ttl">311</div>'
  +'<div class="card"><p>LA MÁQUINA TE ESTÁ ESPERANDO.</p><p>ENTRA. PÁRATE FRENTE A LA CÁMARA. NO TE MUEVAS.</p>'
  +'<p class="dim">Recorrido completado en '+mmss(total)+'. Tu atención ha sido contabilizada.</p></div>'
  +route()
  +'<button class="mini" id="reset">reiniciar recorrido</button>';
  glitch(document.getElementById('ttl'));
  document.getElementById('reset').onclick=function(){st={};save();render()};
}

function render(){
  clearTimeout(timer);
  window.scrollTo(0,0);
  if(!st.on)landing();else if(st.i>=S.length)final();else clue();
}
render();

// lluvia de caracteres
var cv=document.getElementById('rain'),cx=cv.getContext('2d'),W,H,cols,dr=[],FS=16,CH='01ABCDEF<>/|+-=#%$&@';
function rgb(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function fit(){W=cv.width=innerWidth;H=cv.height=innerHeight;cols=Math.ceil(W/FS);dr=[];for(var i=0;i<cols;i++)dr.push(Math.random()*-40);cx.fillStyle='rgb('+rgb('--bg')+')';cx.fillRect(0,0,W,H)}
fit();addEventListener('resize',fit);
var last=0;
function rain(t){
  requestAnimationFrame(rain);
  if(reduce||document.hidden||t-last<55)return;
  last=t;
  cx.fillStyle='rgba('+rgb('--bg')+',.14)';cx.fillRect(0,0,W,H);
  cx.font=FS+'px monospace';
  for(var i=0;i<cols;i++){
    var y=dr[i]*FS;
    cx.fillStyle=Math.random()<.08?'rgba('+rgb('--fg')+',.6)':'rgba('+rgb('--ac')+',.4)';
    cx.fillText(CH.charAt(Math.floor(Math.random()*CH.length)),i*FS,y);
    if(y>H&&Math.random()>.975)dr[i]=0;
    dr[i]+=1;
  }
}
requestAnimationFrame(rain);
})();
</script>
</body>
</html>
